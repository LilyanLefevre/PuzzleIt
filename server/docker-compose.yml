services:
  puzzleit:
    image: ghcr.io/lilyanlefevre/puzzleit-server:latest
    build: .
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    ports:
      # Local only by default: the Cloudflare tunnel reaches the server through the compose network, and you reach the dashboard with
      # `ssh -L 8090:127.0.0.1:8090 <host>`. PUZZLEIT_BIND=0.0.0.0 in .env opens it to the home network (a test phone on Wi-Fi).
      - "${PUZZLEIT_BIND:-127.0.0.1}:8090:8090"
    volumes:
      # Everything the server stores (accounts, records, photos) lives here: back this folder up.
      - ./pb_data:/pb/pb_data

  # Optional, free: an https address on your own domain without opening a port on the box. Start with `docker compose --profile tunnel up -d`.
  # CLOUDFLARED_TOKEN comes from the tunnel you create in the Cloudflare dashboard (see README), kept in server/.env (never committed).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in server/.env}
    depends_on:
      - puzzleit
